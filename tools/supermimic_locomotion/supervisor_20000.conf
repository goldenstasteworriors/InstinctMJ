[unix_http_server]
file=/nix/ykj/instinct_locomotion/services/pair_20261029.sock
chmod=0700

[supervisord]
logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/pair_20261029.supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/nix/ykj/instinct_locomotion/services/pair_20261029.pid
childlogdir=/workspace/ykj/instinct_supermimic/logs/locomotion_official
environment=TMPDIR="/nix/ykj/instinct_locomotion/build"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///nix/ykj/instinct_locomotion/services/pair_20261029.sock

[program:locomotion_resume_20000]
directory=/nix/ykj/instinct_locomotion/InstinctMJ
command=/bin/bash tools/supermimic_locomotion/run_20000.sh resume
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/2026-10-29_smooth_resume8000_to20000_seed42.launcher.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

[program:locomotion_fresh_20000]
directory=/nix/ykj/instinct_locomotion/InstinctMJ
command=/bin/bash tools/supermimic_locomotion/run_20000.sh fresh
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/2026-10-29_smooth_officialflags_fresh20000_seed42.launcher.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
