[unix_http_server]
file=/nix/ykj/instinct_locomotion/services/perception_noamp_20261030.sock
chmod=0700

[supervisord]
logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/perception_noamp_20261030/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/nix/ykj/instinct_locomotion/services/perception_noamp_20261030.pid
childlogdir=/workspace/ykj/instinct_supermimic/logs/locomotion_official/perception_noamp_20261030
environment=TMPDIR="/nix/ykj/instinct_locomotion/build"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///nix/ykj/instinct_locomotion/services/perception_noamp_20261030.sock

[program:perception_queue]
directory=/nix/ykj/instinct_locomotion/InstinctMJ-perception
command=/bin/bash tools/supermimic_locomotion/service_perception_20261030.sh worker
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/perception_noamp_20261030/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
