[unix_http_server]
file=/nix/ykj/instinct_locomotion/services/ppo_friction_20261031.sock
chmod=0700

[supervisord]
logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/ppo_friction_20261031/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/nix/ykj/instinct_locomotion/services/ppo_friction_20261031.pid
childlogdir=/workspace/ykj/instinct_supermimic/logs/locomotion_official/ppo_friction_20261031
environment=TMPDIR="/nix/ykj/instinct_locomotion/build"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///nix/ykj/instinct_locomotion/services/ppo_friction_20261031.sock

[program:ppo_friction]
directory=/nix/ykj/instinct_locomotion/InstinctMJ-ppo-friction
command=/bin/bash tools/supermimic_locomotion/service_ppo_friction_20261031.sh
autostart=true
autorestart=false
startsecs=10
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/workspace/ykj/instinct_supermimic/logs/locomotion_official/ppo_friction_20261031/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
